version: "0.1.0"
description: "QQ Music account, catalog, and streaming playback service for MicroTech"
dependencies:
  idf: ">=5.5"
  espressif/cjson: "^1.7.19"
  espressif/esp_audio_codec:
    version: "^2.6.2"
    # esp_audio_codec 2.6+ refuses ESP32-P4 rev <3.0 at build time. The P4
    # board is rev v1.3, so `main` pins the 2.5 line for that target instead.
    rules:
      - if: "target != esp32p4"
  espressif/esp_new_jpeg: "^1.0.2"
  espressif/libpng: "^1.6.59"
